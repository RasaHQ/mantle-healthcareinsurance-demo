scenario:
  name: "[oop.visitor_limits] A shopper asks about the limits"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are shopping for a plan and not sure which one. Ask what the most is that you would pay in a
    year on each plan, and what the premiums are.

  goals:
    criteria:
      - The agent gives the maximum out-of-pocket of both plans
      - The agent gives the premiums, $0 for the HMO and $39 for the PPO
