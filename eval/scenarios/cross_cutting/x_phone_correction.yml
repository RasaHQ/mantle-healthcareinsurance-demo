scenario:
  name: "[x.phone_correction] A corrected phone number for the callback"

  setup:
    initial_slots:
      member_id: "m1004"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Taylor. Ask whether you can switch to the HMO and accept the callback. Give the number
    555 014 2777, and right away say 'sorry, it's 555 014 2778'.

  goals:
    criteria:
      - The agent books the call at the corrected number 555 014 2778, or asks which number is right
