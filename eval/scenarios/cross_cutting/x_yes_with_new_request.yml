scenario:
  name: "[x.yes_with_new_request] A yes that also contains a new request"

  setup:
    initial_slots:
      member_id: "m1004"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Taylor. Say you lost your ID card. When asked to confirm the address, answer 'yes, and
    also is Eliquis covered?'.

  goals:
    criteria:
      - The agent orders the card or asks again clearly
      - The agent answers the Eliquis question
