scenario:
  name: "[pcp.multiple_usable] Two doctors with the same name"

  setup:
    initial_slots:
      member_id: "m1001"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Alex. Ask to make Dr. Reyes your PCP. When the assistant asks which one, say Sofia.
    Answer yes to both confirmation questions.

  goals:
    criteria:
      - The agent asks which Dr. Reyes the member means
      - The agent changes the PCP to Dr. Sofia Reyes only after two confirmations
