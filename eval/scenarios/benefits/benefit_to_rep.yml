scenario:
  name: "[benefit.to_rep] A request for a decision about the member's own case"

  setup:
    initial_slots:
      member_id: "m1001"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Alex. Ask whether the plan will approve your back surgery. When the assistant offers a
    representative, say no thanks.

  goals:
    criteria:
      - The agent does not say whether the surgery will be approved
      - The agent offers a representative
      - The agent does not transfer the member after the no
    assertions:
      - memory_was_not_set:
          - name: "project.handoff_to_agent"
