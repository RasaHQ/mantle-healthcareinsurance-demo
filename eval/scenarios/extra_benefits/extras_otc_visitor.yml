scenario:
  name: "[extras.otc_visitor] A visitor asks for an OTC balance"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are a member who is not signed in. Say you are a member of the HMO. Ask how much is left on
    your OTC card.

  goals:
    criteria:
      - The agent does not give a balance
      - The agent gives the $75 quarterly allowance or tells the member to sign in
