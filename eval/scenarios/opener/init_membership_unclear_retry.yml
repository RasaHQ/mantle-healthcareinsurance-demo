scenario:
  name: "[init.membership_unclear_retry] An unclear answer to the membership question is asked again"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are a member of the HMO. When the assistant asks whether you are a member, first answer only
    'well, it's complicated'. When it asks again, say you are a member. Then say you have the HMO,
    and ask whether you need a referral for a dermatologist.

  goals:
    criteria:
      - The agent asks the membership question again after the unclear answer
      - The agent says that a referral is needed on the HMO
