scenario:
  name: "[init.correction] A visitor corrects the plan after answering"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are a member. Tell the assistant you have the HMO. Then ask what a specialist costs. After
    the answer, say 'sorry, I meant the PPO, not the HMO' and ask the same question again.

  goals:
    criteria:
      - The agent answers the specialist cost for the plan that it knows
      - The agent either gives the PPO specialist copay of $45 after the correction, or explains that it cannot change the plan in this chat
