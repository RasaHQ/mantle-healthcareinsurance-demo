scenario:
  name: "[init.both_answers_in_one_msg] Membership and plan in one message"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are a member of the PPO. Your first message is exactly 'I'm a member on the PPO, what's my
    copay for urgent care?'. Answer any question the assistant asks.

  goals:
    criteria:
      - The agent does not ask again for information the person already gave
      - The agent gives the PPO urgent care copay of $45
