scenario:
  name: "[init.visitor_typed] A visitor answers the opener questions in words"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are shopping for a Medicare Advantage plan. Answer the assistant's questions in your own
    words, not with buttons: say you are just looking at plans, and that you want the PPO. Then ask
    what a specialist visit costs.

  goals:
    criteria:
      - The agent asks whether the person is a member before it answers
      - The agent gives the PPO specialist copay of $45
