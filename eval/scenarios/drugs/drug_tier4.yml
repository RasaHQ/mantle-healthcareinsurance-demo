scenario:
  name: "[drug.tier4] A tier 4 drug and a specialty drug"

  setup:
    initial_slots:
      member_id: "m1002"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Sam. Ask what Crestor costs. Then ask about Humira.

  goals:
    criteria:
      - The agent says that Crestor is tier 4 with 40% coinsurance
      - The agent says that Humira is tier 5, needs prior authorization and is available only from the specialty pharmacy
