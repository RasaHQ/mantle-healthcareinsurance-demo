scenario:
  name: "[drug.no_drug_named] A drug question without a drug name"

  setup:
    initial_slots:
      member_id: "m1001"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Alex. Ask 'is my new prescription covered?'. When the assistant asks which drug, say
    'atorvastatin 20 mg'.

  goals:
    criteria:
      - The agent asks which drug the member means
      - The agent says that atorvastatin is tier 1 at $0 for a 30-day supply at a preferred pharmacy
