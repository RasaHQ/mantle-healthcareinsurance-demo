scenario:
  name: "[enroll.switch_callback_yes] A switch request with a callback"

  setup:
    initial_slots:
      member_id: "m1004"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Taylor, on the PPO. Ask whether you can switch to the HMO. Accept the call from a
    licensed agent and give the phone number 555 014 2777.

  goals:
    criteria:
      - The agent explains the enrollment periods
      - The agent books a call with a licensed agent at the number given
    assertions:
      - memory_was_set:
          - name: "agent_callback.callback_booked"
            value: true
