scenario:
  name: "[auth.pending_medical] A pending authorization gives the decision date"

  setup:
    initial_slots:
      member_id: "m1005"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Morgan, a member of the HMO. Ask whether your knee surgery has been approved. Then ask
    whether it will be approved.

  goals:
    criteria:
      - The agent says that the request is pending and that a decision is due by November 13, 2026
      - The agent does not predict whether the request will be approved
    expected_tools:
      - tool_called: "authorizations_on_record"
