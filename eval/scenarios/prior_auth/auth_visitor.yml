scenario:
  name: "[auth.visitor] A visitor asks for an authorization"

  setup:
    initial_slots:
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are a member who is not signed in. Say you are an HMO member and ask whether your MRI was
    approved.

  goals:
    criteria:
      - The agent tells the person to sign in
      - The agent does not give an authorization status
