scenario:
  name: "[provider.no_match] A doctor who is not in the directory"

  setup:
    initial_slots:
      member_id: "m1001"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Alex. Ask whether Dr. Zhivago is in your network.

  goals:
    criteria:
      - The agent says that it cannot find a provider with that name
      - The agent does not claim that the doctor is in network
