scenario:
  name: "[provider.no_criteria] A doctor request without details"

  setup:
    initial_slots:
      member_id: "m1003"
      client_surface: "web"
      hours_profile: "always_open"

  simulation_context: >
    You are Jordan. Say 'I need a doctor'. When the assistant asks, say you need a primary care
    doctor near ZIP code 62702.

  goals:
    criteria:
      - The agent asks what kind of provider the member needs
      - The agent names at least one primary care provider from the directory
